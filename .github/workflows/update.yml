name: Auto Update and Deploy Pages

on:
  # schedule:
    # - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.commit.outputs.deploy }}
    steps:
      - name: Clone Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set Timezone to UTC+8
        run: |
          sudo timedatectl set-timezone Asia/Taipei
          echo "Current time: $(date)"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Setup Python
        run: uv venv --python 3.14

      - name: Install Dependencies
        run: uv pip install -r requirements.txt

      - name: Run Python
        run: .venv\Scripts\python.exe main.py

      - name: Commit and Push Files
        id: commit
        run: |
          git config --global user.name 'Canaan-HS'
          git config --global user.email 's3459897@gmail.com'

          if [[ -n $(git status -s) ]]; then
            echo "Changes detected. Committing and pushing..."
            git add -A
            git commit -m "Auto update"
            git push
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "No changes to commit."
            echo "deploy=false" >> $GITHUB_OUTPUT
          fi

  build-pages:
    needs: update
    if: ${{ needs.update.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Prepare site files
        run: |
          mkdir -p dist
          find . -type f ! -name "*.xlsx" ! -name "*.txt" ! -name "*.py" -exec cp --parents {} dist/ \;

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./dist"

  deploy-pages:
    needs:
      - update
      - build-pages
    if: ${{ needs.update.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
