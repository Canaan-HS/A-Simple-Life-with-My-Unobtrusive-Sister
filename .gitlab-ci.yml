stages:
  - update
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - .pip

update:
  stage: update
  image: python:3.14
  only:
    - schedule
  script:
    - sudo timedatectl set-timezone Asia/Taipei
    - echo "Current time: $(date)"
    - pip install -r requirements.txt
    - python main.py
    - git config --global user.name 'Canaan-HS'
    - git config --global user.email 's3459897@gmail.com'
    - |
      if [[ -n $(git status -s) ]]; then
        echo "Changes detected. Committing and pushing..."
        git add -A
        git commit -m "Auto update"
        git push
      else
        echo "No changes to commit."
      fi
  after_script:
    - |
      if [[ -n $(git status -s) ]]; then
        echo "deploy=true" >> deploy_vars.txt
      else
        echo "deploy=false" >> deploy_vars.txt
      fi
  artifacts:
    when: always
    paths:
      - deploy_vars.txt
    expire_in: 1 hour

build:
  stage: build
  image: alpine:latest
  only:
    - main
  variables:
    GIT_DEPTH: 1
  script:
    - apk add --no-cache findutils
    - mkdir -p _site
    - find . -type f ! -name "*.xlsx" ! -name "*.txt" ! -name "*.py" -exec cp --parents {} _site/ \;
  artifacts:
    paths:
      - _site
    expire_in: 1 day
  needs:
    - job: update
      optional: true

pages:
  stage: deploy
  image: alpine:latest
  only:
    - main
  script:
    - apk add --no-cache git
    - mv _site public
  artifacts:
    paths:
      - public
    expire_in: 1 day
  needs:
    - job: build
      optional: true